<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
    
</body>
<script>
   const parent = document.querySelector(".parent");
   console.log(parent);// This will log the parent div element to the console
   console.log(parent.children);// This will log the HTMLCollection(Like array) of child elements (the divs with class "day") to the console
   console.log(parent.children[0]);// This will log the first child element (the div with class "day" and text "Monday") to the console
   console.log(parent.children[0].innerText);// This will log the inner text of the first child element ("Monday") to the console

   parent.children[1].style.color="orange";// This will change the text color of the second child element (the div with class "day" and text "Tuesday") to orange
   parent.children[2].style.backgroundColor="blue";// This will change the background color of the third child element (the div with class "day" and text "Wednesday") to blue

   console.log(parent.firstElementChild);// This will log the first child element (the div with class "day" and text "Monday") to the console
   console.log(parent.lastElementChild);// This will log the last child element (the div with class "day" and text "Thursday") to the console
   
</script>
</html>
